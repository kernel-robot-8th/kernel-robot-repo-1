name: roport-web CI
on:
  push:
    paths:
      - 'services/roport-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'services/roport-web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/roport-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/roport-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: services/roport-web/apps/*/dist/
          if-no-files-found: error
