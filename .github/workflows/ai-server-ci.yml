name: roport-ai-server CI
on:
  push:
    paths:
      - 'roport-ai-server/**'
      - '.github/workflows/ai-server-ci.yml'
  pull_request:
    paths:
      - 'roport-ai-server/**'
      - '.github/workflows/ai-server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: roport-ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
