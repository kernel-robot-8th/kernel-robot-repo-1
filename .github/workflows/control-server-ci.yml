name: roport-control-server CI
on:
  push:
    paths:
      - 'services/roport-control-server/**'
      - 'services/roport-pinky/**'
      - 'services/roport-omx/**'
      - '.github/workflows/control-server-ci.yml'
  pull_request:
    paths:
      - 'services/roport-control-server/**'
      - 'services/roport-pinky/**'
      - 'services/roport-omx/**'
      - '.github/workflows/control-server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/roport-control-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run prepare:assets
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: uv run pytest
        env:
          REQUIRE_MQTT_TESTS: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: uv build
      - run: uv run python tools/check_asset_package.py dist/*.whl
