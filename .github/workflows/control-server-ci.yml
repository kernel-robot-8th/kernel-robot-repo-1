name: roport-control-server CI
on:
  push:
    paths:
      - 'services/roport-control-server/**'
      - '.github/workflows/control-server-ci.yml'
  pull_request:
    paths:
      - 'services/roport-control-server/**'
      - '.github/workflows/control-server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      REQUIRE_UI_TESTS: "1"
    defaults:
      run:
        working-directory: services/roport-control-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt headless runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra ui
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
