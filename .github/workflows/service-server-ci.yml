name: roport-service-server CI
on:
  push:
    paths:
      - 'services/roport-service-server/**'
      - '.github/workflows/service-server-ci.yml'
  pull_request:
    paths:
      - 'services/roport-service-server/**'
      - '.github/workflows/service-server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roport_service_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/roport-service-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/roport-service-server/*.gradle.kts
            services/roport-service-server/gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew --no-daemon build
        env:
          SERVICE_DB_URL: jdbc:postgresql://127.0.0.1:5432/roport_service_test
          SERVICE_DB_USER: postgres
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d roport_service_test -f src/test/sql/V1_constraints.sql
      - run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d roport_service_test -f src/test/sql/seed_idempotent.sql
      - uses: actions/upload-artifact@v4
        with:
          name: service-jar
          path: services/roport-service-server/build/libs/*.jar
          if-no-files-found: error
