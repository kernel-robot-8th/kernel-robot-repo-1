name: roport-service-server CI
on:
  push:
    paths:
      - 'roport-service-server/**'
      - '.github/workflows/service-server-ci.yml'
  pull_request:
    paths:
      - 'roport-service-server/**'
      - '.github/workflows/service-server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: roport-service-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: roport-service-server/pom.xml
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: service-jar
          path: roport-service-server/target/*.jar
          if-no-files-found: error
