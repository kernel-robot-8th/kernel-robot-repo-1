name: roport-omx CI
on:
  push:
    paths:
      - 'services/roport-omx/**'
      - '.github/workflows/omx-ci.yml'
  pull_request:
    paths:
      - 'services/roport-omx/**'
      - '.github/workflows/omx-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/roport-omx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: uv run python -c "import roport_omx"
      - name: Source and read-only probe tests (no hardware)
        run: bash ci/test.sh
      - run: uv build
