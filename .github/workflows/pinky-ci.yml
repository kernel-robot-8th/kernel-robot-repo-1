name: roport-pinky CI
on:
  push:
    paths:
      - 'roport-pinky/**'
      - '.github/workflows/pinky-ci.yml'
  pull_request:
    paths:
      - 'roport-pinky/**'
      - '.github/workflows/pinky-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: roport-pinky
    steps:
      - uses: actions/checkout@v4
      - name: Install colcon
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions
      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select roport_pinky --event-handlers console_direct+
      - name: Check upstream Python syntax
        run: python3 -m compileall -q src/pinky_pro
      - name: Import installed package
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -c "import roport_pinky; import rclpy"
