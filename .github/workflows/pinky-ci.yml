name: roport-pinky CI
on:
  push:
    paths:
      - 'roport-pinky/**'
      - '.github/workflows/pinky-ci.yml'
  pull_request:
    paths:
      - 'roport-pinky/**'
      - '.github/workflows/pinky-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: roport-pinky
    steps:
      - uses: actions/checkout@v4
      - name: Install CI build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions ros-jazzy-xacro ros-jazzy-rosidl-default-generators
      - name: Build interfaces and description; test receive-check logic (no hardware)
        run: bash ci/test.sh
