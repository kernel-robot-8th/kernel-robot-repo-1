name: Commit message CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commit-message-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commit-message:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:commit
      - name: Check PR title and new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          message_file="$RUNNER_TEMP/commit-message.txt"
          if [ "$EVENT_NAME" = pull_request ]; then
            printf '%s\n' "$PR_TITLE" > "$message_file"
            node scripts/check-commit-message.mjs "$message_file"
          fi
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/commit-shas.txt"
          else
            git rev-list --no-merges --no-walk "$HEAD_SHA" > "$RUNNER_TEMP/commit-shas.txt"
          fi
          while IFS= read -r sha; do
            git show -s --format=%B "$sha" > "$message_file"
            node scripts/check-commit-message.mjs "$message_file"
          done < "$RUNNER_TEMP/commit-shas.txt"
