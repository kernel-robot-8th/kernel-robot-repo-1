name: Sync main to task branch

on:
  workflow_dispatch:
    inputs:
      task_branch:
        description: Target task branch, for example task/robot-navigation
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Open sync pull request
        env:
          # SYNC_PR_TOKEN(PR 생성 권한이 있는 토큰)이 있으면 쓴다. 없으면 github.token을 쓰며, 이때는 저장소 설정
          # "Allow GitHub Actions to create and approve pull requests"가 켜져 있어야 한다.
          # github.token으로 만든 PR은 GitHub 규칙상 pull_request CI가 자동 실행되지 않는다.
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          TASK_BRANCH: ${{ inputs.task_branch }}
        run: |
          if [[ ! "$TASK_BRANCH" =~ ^task/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Target must be a task/<lowercase-name> branch" >&2
            exit 1
          fi

          git fetch --no-tags origin main "refs/heads/${TASK_BRANCH}:refs/remotes/origin/${TASK_BRANCH}"

          if git merge-base --is-ancestor origin/main "origin/${TASK_BRANCH}"; then
            echo "${TASK_BRANCH} already contains the latest main commit."
            exit 0
          fi

          existing_pr=$(gh pr list --head main --base "$TASK_BRANCH" --json url --jq '.[0].url // empty')
          if [[ -n "$existing_pr" ]]; then
            echo "Sync pull request already exists: $existing_pr"
            exit 0
          fi

          set +e
          output=$(gh pr create \
            --base "$TASK_BRANCH" \
            --head main \
            --title "chore: sync main into ${TASK_BRANCH}" \
            --body "Synchronize the latest main changes into ${TASK_BRANCH}. Merge this pull request with a merge commit to preserve the branch history." 2>&1)
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            echo "$output" >&2
            if grep -q "not permitted to create or approve pull requests" <<<"$output"; then
              compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${TASK_BRANCH}...main?expand=1"
              echo "::error title=PR 생성 권한 없음::GitHub Actions의 PR 생성이 꺼져 있습니다. Settings > Actions > General > Workflow permissions에서 'Allow GitHub Actions to create and approve pull requests'를 켜거나, PR 생성 권한이 있는 토큰을 저장소 secret SYNC_PR_TOKEN으로 등록하세요. 지금은 ${compare_url} 에서 수동으로 PR(base ${TASK_BRANCH}, head main)을 만들 수 있습니다."
            fi
            exit "$status"
          fi

          echo "$output"
