asyncapi: 3.0.0
info:
  title: RO:PORT field MQTT
  version: '2.0'
  description: 'Single-site local implementation. Runtime field_wire.py is authoritative;
    PR #68 draft site/version topics and route.requested names are superseded. Physical
    validation remains required.'
servers:
  local:
    host: localhost:1883
    protocol: mqtt
channels:
  robotCmd:
    address: roport/robot/{robot_id}/cmd
    messages:
      arm_action_command:
        $ref: '#/components/messages/arm_action_command'
      line_route_command:
        $ref: '#/components/messages/line_route_command'
      nav_goal_command:
        $ref: '#/components/messages/nav_goal_command'
      robot_state_request:
        $ref: '#/components/messages/robot_state_request'
      robot_stop_command:
        $ref: '#/components/messages/robot_stop_command'
      set_drive_mode_command:
        $ref: '#/components/messages/set_drive_mode_command'
      shelf_transfer_command:
        $ref: '#/components/messages/shelf_transfer_command'
      warehouse_load_command:
        $ref: '#/components/messages/warehouse_load_command'
    parameters:
      robot_id:
        description: pinky1/pinky2/pinky3 (motion); pinky1/pinky2/pinky3/omx1/omx2/omx3
          (others)
  robotEvent:
    address: roport/robot/{robot_id}/event
    messages:
      robot_state:
        $ref: '#/components/messages/robot_state'
      command_status:
        $ref: '#/components/messages/command_status'
    parameters:
      robot_id:
        description: pinky1/pinky2/pinky3 (motion); pinky1/pinky2/pinky3/omx1/omx2/omx3
          (others)
  robotAck:
    address: roport/robot/{robot_id}/ack
    messages:
      event_stored:
        $ref: '#/components/messages/event_stored'
    parameters:
      robot_id:
        description: pinky1/pinky2/pinky3 (motion); pinky1/pinky2/pinky3/omx1/omx2/omx3
          (others)
  robotMotion:
    address: roport/robot/{robot_id}/motion
    messages:
      robot_pose:
        $ref: '#/components/messages/robot_pose'
    parameters:
      robot_id:
        description: pinky1/pinky2/pinky3 (motion); pinky1/pinky2/pinky3/omx1/omx2/omx3
          (others)
  robotHost:
    address: roport/robot/{robot_id}/host
    messages:
      host_metrics: &id001
        $ref: '#/components/messages/host_metrics'
    parameters:
      robot_id:
        description: pinky1/pinky2/pinky3/omx3 (OMX1/OMX2 share workcell shelf-01)
  workcellCmd:
    address: roport/workcell/shelf-01/cmd
    messages:
      robot_state_request:
        $ref: '#/components/messages/robot_state_request'
      shelf_transfer_command:
        $ref: '#/components/messages/shelf_transfer_command'
      robot_stop_command:
        $ref: '#/components/messages/robot_stop_command'
  workcellEvent:
    address: roport/workcell/shelf-01/event
    messages:
      robot_state:
        $ref: '#/components/messages/robot_state'
      command_status:
        $ref: '#/components/messages/command_status'
  workcellAck:
    address: roport/workcell/shelf-01/ack
    messages:
      event_stored:
        $ref: '#/components/messages/event_stored'
  workcellHost:
    address: roport/workcell/shelf-01/host
    messages:
      host_metrics: *id001
operations:
  sendrobotCmd:
    action: send
    channel:
      $ref: '#/channels/robotCmd'
    bindings:
      mqtt:
        qos: 1
        retain: false
  receiverobotEvent:
    action: receive
    channel:
      $ref: '#/channels/robotEvent'
    bindings:
      mqtt:
        qos: 1
        retain: false
  sendrobotAck:
    action: send
    channel:
      $ref: '#/channels/robotAck'
    bindings:
      mqtt:
        qos: 1
        retain: false
  receiverobotMotion:
    action: receive
    channel:
      $ref: '#/channels/robotMotion'
    bindings:
      mqtt:
        qos: 0
        retain: false
  receiverobotHost:
    action: receive
    channel:
      $ref: '#/channels/robotHost'
    bindings:
      mqtt:
        qos: 0
        retain: false
  sendworkcellCmd:
    action: send
    channel:
      $ref: '#/channels/workcellCmd'
    bindings:
      mqtt:
        qos: 1
        retain: false
  receiveworkcellEvent:
    action: receive
    channel:
      $ref: '#/channels/workcellEvent'
    bindings:
      mqtt:
        qos: 1
        retain: false
  sendworkcellAck:
    action: send
    channel:
      $ref: '#/channels/workcellAck'
    bindings:
      mqtt:
        qos: 1
        retain: false
  receiveworkcellHost:
    action: receive
    channel:
      $ref: '#/channels/workcellHost'
    bindings:
      mqtt:
        qos: 0
        retain: false
components:
  messages:
    robot_state_request:
      name: robot_state_request
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: robot_state_request
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              expected_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              keep_running_command_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
            required: []
            additionalProperties: false
          expires_at:
            type: string
            format: date-time
        additionalProperties: false
        oneOf:
        - properties:
            payload:
              maxProperties: 0
          not:
            required:
            - expires_at
        - required:
          - expires_at
          properties:
            payload:
              required:
              - expected_boot_version
              - keep_running_command_id
    line_route_command:
      name: line_route_command
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        - command_id
        - expires_at
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: line_route_command
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              expected_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              graph_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              start_node:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              start_heading_rad:
                type: number
                minimum: -3.141592653589793
                maximum: 3.141592653589793
              start_maneuver:
                enum:
                - none
              route:
                type: array
                items:
                  type: string
                  pattern: ^[A-Za-z0-9_.:-]{1,128}$
                minItems: 2
                maxItems: 64
              goal:
                type: object
                properties:
                  node:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                  on_arrival:
                    enum:
                    - hold
                required:
                - node
                - on_arrival
                additionalProperties: false
              speed_limit_mps:
                type: number
                minimum: 0.015
                maximum: 0.08
              departure:
                type: object
                properties:
                  arrival_command_id:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                  transfer_command_id:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                required:
                - arrival_command_id
                - transfer_command_id
                additionalProperties: false
            required:
            - expected_boot_version
            - graph_version
            - start_node
            - start_heading_rad
            - start_maneuver
            - route
            - goal
            - speed_limit_mps
            additionalProperties: false
          command_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          expires_at:
            type: string
            format: date-time
        additionalProperties: false
    set_drive_mode_command:
      name: set_drive_mode_command
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        - command_id
        - expires_at
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: set_drive_mode_command
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              expected_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              node:
                enum:
                - N12
              from_mode:
                enum:
                - line
                - nav2
              to_mode:
                enum:
                - line
                - nav2
              graph_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              map_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
            required:
            - expected_boot_version
            - node
            - from_mode
            - to_mode
            - graph_version
            - map_version
            additionalProperties: false
          command_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          expires_at:
            type: string
            format: date-time
        additionalProperties: false
    nav_goal_command:
      name: nav_goal_command
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        - command_id
        - expires_at
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: nav_goal_command
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              expected_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              map_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              frame_id:
                enum:
                - map
              pose:
                type: object
                properties:
                  x:
                    type: number
                    minimum: -10000
                    maximum: 10000
                  y:
                    type: number
                    minimum: -10000
                    maximum: 10000
                  yaw:
                    type: number
                    minimum: -3.141592653589793
                    maximum: 3.141592653589793
                required: &id005
                - x
                - y
                - yaw
                additionalProperties: false
              goal_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              position_tolerance_m:
                type: number
                minimum: 0.01
                maximum: 0.5
              yaw_tolerance_rad:
                type: number
                minimum: 0.01
                maximum: 0.5
            required:
            - expected_boot_version
            - map_version
            - frame_id
            - pose
            - position_tolerance_m
            - yaw_tolerance_rad
            additionalProperties: false
          command_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          expires_at:
            type: string
            format: date-time
        additionalProperties: false
    shelf_transfer_command:
      name: shelf_transfer_command
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        - command_id
        - expires_at
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: shelf_transfer_command
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              expected_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              package_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              arrival_command_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              expected_pinky_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              operation:
                enum:
                - store
                - retrieve
              slot_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              pinky_id:
                enum:
                - pinky1
                - pinky2
                - pinky3
              arms:
                type: array
                items:
                  type: object
                  properties:
                    robot_id:
                      enum:
                      - omx1
                      - omx2
                    expected_boot_version:
                      type: string
                      pattern: ^[A-Za-z0-9_.:-]{1,128}$
                  required:
                  - robot_id
                  - expected_boot_version
                  additionalProperties: false
                minItems: 2
                maxItems: 2
              model_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              calibration_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
            required:
            - expected_boot_version
            - package_id
            - arrival_command_id
            - expected_pinky_boot_version
            - operation
            - slot_id
            - pinky_id
            - arms
            - model_version
            - calibration_version
            additionalProperties: false
          command_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          expires_at:
            type: string
            format: date-time
        additionalProperties: false
    arm_action_command:
      name: arm_action_command
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        - command_id
        - expires_at
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: arm_action_command
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              expected_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              operation:
                enum:
                - transfer
                - return_home
              workcell_id:
                enum:
                - shelf-01
              calibration_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              package_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              arrival_command_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              expected_pinky_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              source_location:
                type: object
                properties:
                  kind:
                    enum: &id002
                    - pinky
                    - shelf
                  robot_id:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                  position:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                  slot_id:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                required: &id003
                - kind
                additionalProperties: false
              destination_location:
                type: object
                properties:
                  kind:
                    enum: *id002
                  robot_id:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                  position:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                  slot_id:
                    type: string
                    pattern: ^[A-Za-z0-9_.:-]{1,128}$
                required: *id003
                additionalProperties: false
              model_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
            required:
            - expected_boot_version
            - operation
            - workcell_id
            - calibration_version
            additionalProperties: false
          command_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          expires_at:
            type: string
            format: date-time
        additionalProperties: false
    warehouse_load_command:
      name: warehouse_load_command
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        - command_id
        - expires_at
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: warehouse_load_command
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              expected_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              package_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              arrival_command_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              expected_pinky_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              pickup_location_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              pinky_id:
                enum:
                - pinky1
                - pinky2
                - pinky3
              load_position:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              model_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              calibration_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
            required:
            - expected_boot_version
            - package_id
            - arrival_command_id
            - expected_pinky_boot_version
            - pickup_location_id
            - pinky_id
            - load_position
            - model_version
            - calibration_version
            additionalProperties: false
          command_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          expires_at:
            type: string
            format: date-time
        additionalProperties: false
    robot_stop_command:
      name: robot_stop_command
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        - command_id
        - expires_at
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: robot_stop_command
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              expected_boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              target_command_id:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              reason:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
            required:
            - expected_boot_version
            - target_command_id
            - reason
            additionalProperties: false
          command_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          expires_at:
            type: string
            format: date-time
        additionalProperties: false
    robot_state:
      name: robot_state
      contentType: application/json
      payload:
        type: object
        required:
        - message_id
        - source
        - target
        - schema_version
        - profile
        - type
        - sent_at
        - payload
        properties:
          message_id:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          source:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          target:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,128}$
          schema_version:
            const: '2.0'
          profile:
            const: roport-control-v2
          type:
            const: robot_state
          sent_at:
            type: string
            format: date-time
          payload:
            type: object
            properties:
              boot_version:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,128}$
              observed_at:
                type: string
              sequence:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              active_command_id:
                anyOf:
                - type: string
                  pattern: ^[A-Za-z0-9_.:-]{1,128}$
                - type: 'null'
              state:
                oneOf:
                - type: object
                  properties:
                    node:
                      anyOf:
                      - type: string
                        pattern: ^[A-Za-z0-9_.:-]{1,128}$
                      - type: 'null'
                    arrival_command_id:
                      anyOf:
                      - type: string
                        pattern: ^[A-Za-z0-9_.:-]{1,128}$
                      - type: 'null'
                    mode:
                      enum:
                      - line
                      - nav2
                      - unknown
