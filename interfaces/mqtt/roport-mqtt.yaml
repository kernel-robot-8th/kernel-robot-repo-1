asyncapi: 3.0.0
info:
  title: RO:PORT MQTT 인터페이스
  version: 1.1.0-draft
  description: |
    관제 ↔ Pinky / OMX 작업셀 MQTT 계약. 기준: Confluence "Interface Specification (comm)" 운영 검토안.
    **필수 ID는 `message_id`, `robot_id`, `user_id`, `product_id`, `gate_id` 5개뿐이다.**
    `task_id`·`step_id`·`command_id`·`execution_id`·`site_id`는 필요한 정보이지만 메시지에는 싣지 않는다
    (환경은 토픽 주소의 `{site}`로 구분한다). 상태는 enum 필드로 표현한다.
    시험용 `roport-pinky-driving-trial-v1` 스키마는 포함하지 않는다.

    **이 문서는 설계 초안이며 현재 코드(관제 서버 `messages.py`, OMX `mqtt_link/`)와 일치하지 않는다.
    코드 적용은 별도 작업이다.**
    위 ID를 제거하면서 중복 실행 방지와 오래된 명령 방어를 `message_id`·`expires_at`만으로는 보장할 수 없다.
    중복 처리 이력의 보존 범위·기간, 재시작 후 처리, 새 명령이 대체한 이전 명령의 거부 기준은 아직 정해지지 않았으며
    코드에 적용하기 전에 먼저 정해야 한다.
    `expires_at` 판정은 로봇과 관제의 시계가 맞는다는 전제가 필요하다. 로봇 시계가 늦으면 만료된 명령이 유효해 보이므로
    시각 동기화(NTP) 요구 또는 수신 시각 기준 판정도 함께 정해야 한다.

servers:
  mosquitto:
    host: localhost:1883
    protocol: mqtt
    description: P0 현장 Mosquitto. 운영 host·TLS·인증은 환경 설정으로 분리.

channels:
  robotCmd:
    address: roport/v1/{site}/robot/{robot_id}/cmd
    parameters:
      site: {description: "환경. demo | test", enum: [demo, test]}
      robot_id: {description: "수신 로봇. robot/ 토픽은 pinky1·2·3과 omx3만 받는다. omx1·omx2는 shelf-01 작업셀 채널(추가 예정)로 다루므로 RobotId(6개)보다 좁다.", enum: [pinky1, pinky2, pinky3, omx3]}
    messages:
      routeRequested: {$ref: '#/components/messages/routeRequested'}
  robotEvent:
    address: roport/v1/{site}/robot/{robot_id}/event
    parameters:
      site: {description: "환경. demo | test", enum: [demo, test]}
      robot_id: {description: "발행 로봇. robot/ 토픽은 pinky1·2·3과 omx3만 쓴다. omx1·omx2는 shelf-01 작업셀 채널(추가 예정)로 다루므로 RobotId(6개)보다 좁다.", enum: [pinky1, pinky2, pinky3, omx3]}
    messages:
      routeProgress: {$ref: '#/components/messages/routeProgress'}

operations:
  sendRobotCmd:
    action: send
    channel: {$ref: '#/channels/robotCmd'}
    summary: 관제 → 로봇 명령 (QoS 1, retain=false)
    bindings: {mqtt: {qos: 1, retain: false}}
  receiveRobotEvent:
    action: receive
    channel: {$ref: '#/channels/robotEvent'}
    summary: 로봇 → 관제 결과 (QoS 1, retain=false)
    bindings: {mqtt: {qos: 1, retain: false}}

components:
  schemas:
    # ---- 필수 ID 5개 ----
    Id:
      type: string
      pattern: '^[A-Za-z0-9_.:-]{1,128}$'
    MessageId:
      description: 메시지 고유 ID. 재전송은 같은 값을 유지한다.
      allOf:
        - $ref: '#/components/schemas/Id'
    RobotId:
      description: 로봇 ID
      enum: [pinky1, pinky2, pinky3, omx1, omx2, omx3]
    UserId:
      description: 고객(회원) ID. 예약·인도 메시지에서 사용한다.
      allOf:
        - $ref: '#/components/schemas/Id'
    ProductId:
      description: 상품(포장품) ID. 상차·입고·반출 메시지에서 사용한다.
      allOf:
        - $ref: '#/components/schemas/Id'
    GateId:
      description: 수령 위치 ID (Gate 1·2·3, 입국장).
      allOf:
        - $ref: '#/components/schemas/Id'
    # ---- ID가 아닌 별도 enum (필수 ID 5개에 포함하지 않음) ----
    Pinky:
      description: 상차·입고·반출 대상 Pinky. 토픽의 robot_id와 다른 의미라 별도 enum으로 둔다.
      enum: [pinky1, pinky2, pinky3]
    DockPoint:
      description: 도킹·대기 지점. gate_id(수령 위치)와 구분한다. 값은 확정 전(P4·P7 외 추가 가능). 현재 쓰는 메시지가 없다. Pinky 그래프는 P4·P7이 아니라 노드 ID(N01·N11 등)만 쓰므로 도킹 메시지를 정할 때 노드 ID로 통일할지 판단한다(대응 관계는 지도 문서로 확인 필요).
      enum: [P4, P7]
    # ---- 공통 envelope ----
    Envelope:
      type: object
      required: [schema_version, message_id, type, source, target, sent_at, payload]
      properties:
        schema_version: {const: "1.0"}
        message_id: {$ref: '#/components/schemas/MessageId'}
        in_reply_to:
          description: 응답이 가리키는 명령·이벤트의 message_id. 응답(event·ack)에서 필수.
          allOf:
            - $ref: '#/components/schemas/MessageId'
        type: {type: string}
        source: {type: string, description: 발행 주체(논리 이름)}
        target: {type: [string, "null"], description: 수신 주체}
        sent_at: {type: string, format: date-time, description: UTC ISO 8601}
        expires_at: {type: string, format: date-time, description: cmd의 새 실행 허용 만료. sent_at보다 늦어야 함}
        payload: {type: object}
  messages:
    routeRequested:
      name: route.requested
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            required: [expires_at]
            properties:
              type: {const: route.requested}
              payload:
                type: object
                required: [graph_version, start_node, start_heading_rad, start_maneuver, route, goal, speed_limit_mps]
                properties:
                  graph_version: {type: string}
                  start_node: {type: string}
                  start_heading_rad:
                    type: number
                    description: 출발 방향(rad). 현재 Pinky 구현은 상차 정차 방향 또는 첫 구간 방향과 0.35 rad를 넘게 다르면 거절한다(loading_heading_mismatch, start_heading_not_first_leg).
                  start_maneuver: {type: string}
                  route:
                    type: array
                    minItems: 1
                    items: {type: string}
                    description: 출발 노드 포함. 마지막 원소가 목적 노드. start_node와 첫 원소의 일치는 스키마로 표현할 수 없어 수신 측이 검증한다.
                  goal:
                    type: object
                    description: 목적지 노드는 별도 필드 없이 route의 마지막 원소다(물류 목적지 N01·N11·N16 포함). gate_id는 수령 위치(Gate 1·2·3, 입국장)가 목적지일 때만 채운다.
                    properties:
                      gate_id: {description: 목적 수령 위치. 수령 위치가 아니면 null, oneOf: [{$ref: '#/components/schemas/GateId'}, {type: "null"}]}
                      on_arrival: {type: string}
                  speed_limit_mps:
                    type: number
                    exclusiveMinimum: 0
                    description: 속도 상한(m/s). 수신 측이 범위를 벗어나면 거절한다(현재 Pinky 구현은 로봇 설정의 최소 속도 미만이면 speed_limit_too_low로 거절하고, 시험 상한은 0.08 m/s다). Confluence 명세는 선택 필드지만 현재 Pinky 구현이 이 값을 필수로 읽어 이 초안은 필수로 둔다.
    routeProgress:
      name: route.progress
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            required: [in_reply_to]
            properties:
              type: {const: route.progress}
              payload:
                type: object
                required: [node, seq, total, observed_at, phase_revision, phase]
                properties:
                  node: {type: string, description: 현재 통과한 노드 이름. 현재 코드의 node_id에 해당하며 필수 ID 5개 원칙에 따라 node로 적었다(코드 적용 때 이름을 정렬한다).}
                  seq: {type: integer}
                  total: {type: integer}
                  prev_node: {type: [string, "null"]}
                  next_node: {type: [string, "null"]}
                  maneuver: {type: string}
                  detected_by: {type: string}
                  distance_from_prev_m: {type: number}
                  observed_at: {type: string, format: date-time}
                  phase_revision: {type: integer}
                  phase:
                    type: string
                    description: "진행 단계. 값 집합이 확정되지 않아 enum으로 선언하지 못했다(상태는 enum 규칙의 예외). 알려진 값: NODE_PASSED, ARRIVED, DOCKED 등. 확정되면 enum으로 바꾼다."
