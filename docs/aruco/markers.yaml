# RO:PORT ArUco 마커 ID 표 (v1, Jira FFT1-74)
#
# 이 파일이 원본이다. 고친 뒤 인쇄 시트와 이미지를 다시 만든다:
#   python3 docs/aruco/generate_markers.py
#
# size_mm: 검은 사각형(마커) 한 변. quiet_mm: 마커 둘레 흰 여백(인쇄 시 자르는 선까지).
# 위치·부착 높이는 강의실 실측 후 갱신한다(v1은 실측 전 배정).

version: 1
dictionary: DICT_4X4_50

reserved:
  - {ids: [0, 0], use: "인식 거리 시험용(운영 마커로 쓰지 않음)"}
  - {ids: [27, 34], use: "예비"}
  - {ids: [35, 49], use: "스마트카트 고객 추종용(FFT1-86 담당이 배정)"}

markers:
  # 대기·충전·정차 구역: 벽에 부착
  - {id: 1, name: P1, group: place, size_mm: 150, quiet_mm: 10, mount: wall, use: "스마트카트 대기·충전"}
