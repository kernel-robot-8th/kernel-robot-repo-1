  - {id: 5, name: P5, group: place, size_mm: 150, quiet_mm: 10, mount: wall, use: "물류 Pinky 대기·충전"}
  - {id: 6, name: P6, group: place, size_mm: 150, quiet_mm: 10, mount: wall, use: "물류 Pinky 대기·충전"}
  - {id: 7, name: P7, group: place, size_mm: 100, quiet_mm: 10, mount: wall, use: "인도장 스마트카트 정차 구역"}
