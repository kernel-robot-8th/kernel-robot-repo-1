# RO:PORT ArUco 마커 ID 표 (v1.4, Jira FFT1-74)
#
# 이 파일이 원본이다. 고친 뒤 인쇄 시트와 이미지를 다시 만든다:
#   python3 docs/aruco/generate_markers.py
#
# size_mm: 검은 사각형(마커) 한 변. quiet_mm: 마커 둘레 흰 여백(인쇄 시 자르는 선까지).
# 위치·부착 높이는 강의실 실측 후 갱신한다(v1은 실측 전 배정).
# v1.1(2026-10-29): 인쇄해 보니 150 mm가 커서 P·Gate를 100 mm로, 포장물품을 60 → 50 mm로 줄임.
# v1.2(2026-10-31): P7을 물류 Pinky·스마트카트 공용으로, 예비였던 ID 27을 입국장(ARR)에 배정.
# v1.3(2026-10-31): P4·P7을 20 mm 바닥 부착으로 변경(진입로가 짧고 선반·OMX 자리 때문에 벽 부착 불가).
#   벽 마커(P1~P3·P5·P6·Gate·ARR)는 인식되는 범위에서 바닥에 최대한 가깝게 붙인다. 선반·포장물품은 OMX용.
# v1.4(2026-11-06): OMX 인도장 선반을 2x3(6칸)으로 다시 만듦(OMX 선반 도면 Rev A, 2026-11-05).
#   선반 ID를 11~14(2x2)에서 28~33(6칸)으로 옮기고 크기를 20 mm로 바꿈. 30 mm도 함께 인쇄(alt_sizes_mm).
#   11~14는 예비로 돌림(옛 2x2 선반 인쇄물은 쓰지 않음).

version: "1.4"
dictionary: DICT_4X4_50

reserved:
  - {ids: [0, 0], use: "인식 거리 시험용(운영 마커로 쓰지 않음)"}
  - {ids: [11, 14], use: "예비(v1.3까지 2x2 선반 S1~S4. 옛 인쇄물은 버림)"}
  - {ids: [34, 34], use: "예비"}
  - {ids: [35, 49], use: "스마트카트 고객 추종용(FFT1-86 담당이 배정)"}

markers:
  # 대기·충전 구역(P1~P3·P5·P6)·입국장: 벽, 인식되는 범위에서 바닥에 최대한 가깝게. P4·P7 정차 구역은 바닥
  - {id: 1, name: P1, group: place, size_mm: 100, quiet_mm: 8, mount: wall, use: "스마트카트 대기·충전"}
  - {id: 2, name: P2, group: place, size_mm: 100, quiet_mm: 8, mount: wall, use: "스마트카트 대기·충전"}
  - {id: 3, name: P3, group: place, size_mm: 100, quiet_mm: 8, mount: wall, use: "스마트카트 대기·충전"}
  - {id: 4, name: P4, group: floor, size_mm: 20, quiet_mm: 4, mount: floor, use: "물류 상차 정차 구역(바닥)"}
  - {id: 5, name: P5, group: place, size_mm: 100, quiet_mm: 8, mount: wall, use: "물류 Pinky 대기·충전"}
  - {id: 6, name: P6, group: place, size_mm: 100, quiet_mm: 8, mount: wall, use: "물류 Pinky 대기·충전"}
  - {id: 7, name: P7, group: floor, size_mm: 20, quiet_mm: 4, mount: floor, use: "인도장 정차 구역(물류 Pinky·스마트카트 공용, 한 번에 한 대, 바닥)"}
  - {id: 27, name: ARR, group: place, size_mm: 100, quiet_mm: 8, mount: wall, use: "입국장(스마트카트 수령 위치·게이트 안내 출발점)"}
  # 게이트: 벽, 인식되는 범위에서 바닥에 최대한 가깝게
  - {id: 8, name: G1, group: gate, size_mm: 100, quiet_mm: 8, mount: wall, use: "Gate 1"}
  - {id: 9, name: G2, group: gate, size_mm: 100, quiet_mm: 8, mount: wall, use: "Gate 2"}
  - {id: 10, name: G3, group: gate, size_mm: 100, quiet_mm: 8, mount: wall, use: "Gate 3"}
  # (OMX용 — 부착 위치는 OMX 담당 확인) OMX 인도장 선반 2x3: 칸 이름은 선반 도면 그대로(1 = 아래층, 2 = 위층,
  # A·B·C = 팔 쪽에서 볼 때 왼쪽부터). 칸 안쪽에 부착. 20 mm 기본, 30 mm 도 같이 인쇄(OMX 요청)
  - {id: 28, name: S1A, group: shelf, size_mm: 20, quiet_mm: 4, alt_sizes_mm: [30], mount: shelf_wall, use: "선반 아래층 왼쪽 칸(1A)"}
  - {id: 29, name: S1B, group: shelf, size_mm: 20, quiet_mm: 4, alt_sizes_mm: [30], mount: shelf_wall, use: "선반 아래층 가운데 칸(1B)"}
  - {id: 30, name: S1C, group: shelf, size_mm: 20, quiet_mm: 4, alt_sizes_mm: [30], mount: shelf_wall, use: "선반 아래층 오른쪽 칸(1C)"}
  - {id: 31, name: S2A, group: shelf, size_mm: 20, quiet_mm: 4, alt_sizes_mm: [30], mount: shelf_wall, use: "선반 위층 왼쪽 칸(2A)"}
  - {id: 32, name: S2B, group: shelf, size_mm: 20, quiet_mm: 4, alt_sizes_mm: [30], mount: shelf_wall, use: "선반 위층 가운데 칸(2B)"}
  - {id: 33, name: S2C, group: shelf, size_mm: 20, quiet_mm: 4, alt_sizes_mm: [30], mount: shelf_wall, use: "선반 위층 오른쪽 칸(2C)"}
  # (OMX용 — 크기·부착은 OMX 담당 확인) 포장물품: 윗면에 하늘을 보게 부착
  - {id: 15, name: PKG1, group: package, size_mm: 50, quiet_mm: 6, mount: top, use: "포장물품 1"}
  - {id: 16, name: PKG2, group: package, size_mm: 50, quiet_mm: 6, mount: top, use: "포장물품 2"}
  - {id: 17, name: PKG3, group: package, size_mm: 50, quiet_mm: 6, mount: top, use: "포장물품 3"}
  - {id: 18, name: PKG4, group: package, size_mm: 50, quiet_mm: 6, mount: top, use: "포장물품 4"}
  - {id: 19, name: PKG5, group: package, size_mm: 50, quiet_mm: 6, mount: top, use: "포장물품 5"}
  - {id: 20, name: PKG6, group: package, size_mm: 50, quiet_mm: 6, mount: top, use: "포장물품 6"}
  - {id: 21, name: PKG7, group: package, size_mm: 50, quiet_mm: 6, mount: top, use: "포장물품 7"}
  - {id: 22, name: PKG8, group: package, size_mm: 50, quiet_mm: 6, mount: top, use: "포장물품 8"}
  # Pinky 트레이(120 x 145 mm) 모서리: 모든 트레이에 같은 ID 4개. 위에서 볼 때 Pinky 앞쪽이 위
  - {id: 23, name: T_FL, group: tray, size_mm: 20, quiet_mm: 4, mount: top, copies: 3, use: "트레이 앞 왼쪽 모서리"}
  - {id: 24, name: T_FR, group: tray, size_mm: 20, quiet_mm: 4, mount: top, copies: 3, use: "트레이 앞 오른쪽 모서리"}
  - {id: 25, name: T_RR, group: tray, size_mm: 20, quiet_mm: 4, mount: top, copies: 3, use: "트레이 뒤 오른쪽 모서리"}
  - {id: 26, name: T_RL, group: tray, size_mm: 20, quiet_mm: 4, mount: top, copies: 3, use: "트레이 뒤 왼쪽 모서리"}

# 인식 거리 시험 시트: ID 0을 운영 마커와 같은 크기로 인쇄
range_test:
  id: 0
  sizes_mm: [100, 50, 30, 20]
