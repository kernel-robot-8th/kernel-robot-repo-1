[project]
name = "roport-control-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "paho-mqtt==2.1.0",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.7",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/roport_control_server/spatial_assets/vendor/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["ruff==0.17.2", "pytest==9.1.1", "httpx==0.28.1"]

[tool.ruff]
target-version = "py312"
