[project]
name = "roport-control-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
ui = [
    "pyqt6==6.12.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff==0.17.2", "pytest==9.1.1", "httpx==0.28.1"]

[tool.ruff]
target-version = "py312"
