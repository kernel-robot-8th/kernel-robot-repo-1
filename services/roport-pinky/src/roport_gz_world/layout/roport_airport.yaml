# RO:PORT 시연 공간 배치 데이터 v16 (도면·지도·Gazebo world 생성 원본)
#
# 출처: 강의실 실측 2026-11-02 (Jira FFT1-96), 02 인도장·03 아래 벽 재측정 2026-11-03,
# 02 인도장 세로선 2개 추가·벽-왼쪽 기준 재측정 2026-11-05~06 (Jira FFT1-149),
# 본선 분기 → 가로선 재측정 2026-11-16(50 cm 자, 테이프 가운데 → 가운데, 테이프는 다시 붙이지 않음),
# 본선 ↔ 벽 재측정 2026-11-19(줄자, 본선 테이프 가장자리 → 벽 면, 노드 x 에서. 아래 walls 주석의 A·B).
# 실측 메모 사진은 사람이 찍혀 저장소에 넣지 않음.
# 좌표계(실측): 단위 cm, 원점 = 콘센트 벽·통로 쪽 모서리, x = 길이 방향, y = 창가 방향
# 이 파일을 고친 뒤 패키지 폴더에서 다시 생성한다:
#   python3 -m roport_gz_world.generate_world     # worlds/roport_airport.sdf
#   python3 -m roport_gz_world.generate_map       # ../../maps/airport_map.{pgm,yaml,png}
#   python3 -m roport_gz_world.draw_layout        # ../../maps/map_measured_v16.png (matplotlib)
#
# 테이프 치수는 "선 바깥 기준"으로 잰 값이다(메모: D·c, R·Q·N11 세로선은 바깥선부터).
# 아래 좌표는 테이프 중심선이므로 테이프 폭의 절반(1.2 cm)을 더하거나 뺐다.
# provisional: true 는 이번 실측에 없는 값이다(위치 추정·가정).

version: v16
units: cm

# 실측 좌표 → SLAM 지도(map) 좌표: map = R(yaw) * (실측 / 100) + (x_m, y_m)
# 2026-10-27 SLAM 지도(maps/airport_map_slam_20261027.pgm) 벽 점유 칸에 실측 벽을 맞춘 값.
# world 좌표 = map 좌표이므로 로봇은 world (0, 0)에서 SLAM 시작 위치(실측 약 152, 202)에 나타난다.
frame:
  x_m: -1.520
  y_m: -2.0225
  yaw_deg: 0.10

defaults:
  wall_thickness: 0.5        # 가벽 두께
  wall_height: 24            # 실측 (맵 벽 높이 24)
  object_height: 24          # 물체는 벽 높이와 같게 둔다(사용자 결정 2026-11-02)
  line_width: 2.4            # 흰 마스킹 테이프 24 mm

# 실측 기반 지도(pgm) 설정. 해상도·원점·크기는 SLAM 지도와 같게 둬서 기존 좌표를 바꾸지 않는다.
map:
  resolution: 0.05
  origin: [-1.654, -2.094]
  width: 92
  height: 53
  lidar_height: 12.5         # Pinky 라이다 높이. 이보다 낮은 물체는 지도에 그리지 않음

# 벽: 선분(from → to) 중심선, 충돌 있음
# 2026-11-19 실측(사용자, 줄자, 테이프 24 mm): 본선 테이프는 곧지만 강의실 벽과 평행하지 않다(사용자 확인).
# 사용자 결정: 노드·그래프 좌표(본선 y 73.2)는 그대로 두고, 본선 ↔ 벽 실측 거리에 맞춰 벽을 옮기거나 기울인다.
#   A = 본선 테이프의 03 쪽 가장자리(y 74.4) → 03 아래 벽(zone03_bottom) 면:
#       N19(x 209.4) 16.2 · N24(258.0) 16.2 · N09(306.45) 15.5 · N08(339.45) 15.2 · N12(375.55) 14.8
#       (v15 지도 19.35). 벽 면 = 74.4 + A, 벽 중심 = 면 + 0.25
#   B = 본선 테이프의 통로 쪽 가장자리(y 72.0) → 통로 벽(outer_aisle) 면: N08 75.0 · N12 75.4 (v15 지도 72.0)
# 본선 구간에서는 A·B 가 예전 메모 ㅂ 94.5 · Ⓓ 93.5 · b 72(통로 벽 → 본선)를 대신한다.
walls:
  # 외곽 444.5 x 221: 가로 G 138 + H 306.5, 세로 e 221
  # 통로 벽 서쪽(x 0~280)은 v15 그대로(b 72, 02 칸막이 서쪽은 새 실측 없음).
  - {name: outer_aisle, from: [0, 0], to: [280, 0]}            # 아래 = 통로(콘센트 벽)
  # 통로 벽 동쪽(x 280~444.5)은 b 72(서쪽 루프, x 112.5 기준) + B(N08·N12)로 맞춘 직선:
  #   면 y(x) = -0.0132 * (x - 112.5) → N08 -3.00 · N12 -3.47 (실측 -3.0 · -3.4)
  - {name: outer_aisle_east, from: [280, -2.21], to: [444.5, -4.38]}
  - {name: outer_right, from: [444.5, -4.38], to: [444.5, 221]}
  - {name: outer_window, from: [444.5, 221], to: [0, 221]}     # 위 = 창가
  # 벽-왼쪽은 폼보드 없는 강의실 벽: 벽 면 = x 0(이 벽에서 잰 값은 0부터). 모델 벽 선은 x 0 그대로
  - {name: outer_left, from: [0, 221], to: [0, 0]}
  # 03 공용 내부공간: 왼쪽 벽 x = G 138. 아래 벽은 2026-11-19 A 로 놓은 꺾은선(노드 x 마다 한 점).
  # v15 까지는 ㅂ 94.5(두 벽 포함) → 중심 94 · Ⓓ 93.5 를 썼다(지금은 본선 구간에서 A 로 대신함).
  # A 로 놓은 벽 → 창가 벽 면은 130.15 로 [19] 129.5 와 0.65 · 메모 f 129 와 1.15 차이(v15 127 은 2.5 · 2.0 차이).
  - {name: zone03_left, from: [138, 90.85], to: [138, 221]}
  # 아래 벽 길이 I = H 306.5 - 입구 65 = 241.5 (끝 x 379.5 그대로)
  # x 138~209.4 는 실측 없음: N19·N24 값(16.2)으로 평평하게 둔다
  - {name: zone03_bottom, from: [138, 90.85], to: [258.0, 90.85]}      # ~N19·N24: A 16.2
  - {name: zone03_bottom_n24, from: [258.0, 90.85], to: [306.45, 90.15]}  # → N09: A 15.5
  - {name: zone03_bottom_n09, from: [306.45, 90.15], to: [339.45, 89.85]}  # → N08: A 15.2
  - {name: zone03_bottom_n08, from: [339.45, 89.85], to: [375.55, 89.45]}  # → N12: A 14.8
  # N12 → 벽 끝 379.5 는 N08~N12 기울기를 이어 감
  - {name: zone03_bottom_n12, from: [375.55, 89.45], to: [379.5, 89.41]}
  # 02 인도장 양옆 칸막이: 인도장 가로 142, 길이 P 54 · T 49 (왼쪽 x는 03 왼쪽 벽과 같은 선으로 가정)
  - {name: partition_warehouse, from: [138, 0], to: [138, 54]}
  # 오른쪽 칸막이는 기운 통로 벽 동쪽 시작점(y -2.21)부터 그려 틈을 막는다(칸막이 끝 y 49 그대로)
  - {name: partition_delivery, from: [280, -2.21], to: [280, 49]}

# 물체: 축 정렬 상자 (min/max 모서리), 충돌 있음
objects:
  # 03 상자 K 67.4 x J 21: 창가 벽에서 N 60.5, 오른쪽 벽에서 L 51.5(ㄴ 51)
  # (03 아래 벽까지 M 46.9 → 45.5로 1.4 차이. 창가 벽 기준 N을 따름)
  # v16: 03 아래 벽을 옮겨 지도상 상자 → 03 아래 벽 면은 약 49.8~50.1(M 46.9와 약 3 차이). 상자는 창가 벽 기준이라 그대로
  - {name: box_03, min: [325.6, 139.5], max: [393.0, 160.5]}
  # 03 카메라 삼각대: 받침대 ㄷ 25.8 x ㄹ 25.5, 03 아래 벽에 붙음. G1 게이트 벽(03 왼쪽 벽)에서 58
  # v16: 03 아래 벽(중심 90.85)을 따라 옮김(v15 94.0)
  - {name: camera_tripod, min: [196.0, 90.85], max: [221.8, 116.35]}
  # 01 창고박스 b 50.8 x a 39, 높이 11 (라이다보다 낮아 지도에 안 그림). 왼쪽 벽·통로 벽 모서리
  - {name: warehouse_box, min: [0, 0], max: [50.8, 39], height: 11}
  # 01 OMX3 받침: 가로 d 27 x 깊이 c 33, 창고박스 오른쪽에 붙음
  - {name: omx3_base, min: [50.8, 0], max: [77.8, 33]}
  # 이하 02 인도장 값은 재측정 기록지(Confluence 19136514, [번호]·a~d)를 쓴다.
  # 벽-선반(통로 벽, 폼보드) 면 y 0.25, 칸막이-좌 면 x 138.25(가정), 벽-03 면 y 93.75(v15)
  # v16: 03 아래 벽을 2026-11-19 A 로 옮겨 벽-03 면 기준 [11]·[12]는 지도와 약 2.9 cm 다르다.
  #      02 물체는 벽-선반 면 기준([8]·[10])이라 그대로 둔다.
  # x 는 벽-왼쪽 면(0)에서 잰 N11 세로선 c 208.2 를 기준으로 OMX1·2 를 놓는다(2026-11-06):
  #   N11 왼쪽 가장자리 208.2 → OMX1 오른쪽 면 = 208.2 - 11.4(N11 ↔ OMX1) = 196.8
  #   오목 폭 [6] 25.8, 받침 한쪽 가로 = ([5]+[6]+[7] 72.6 - 25.8) / 2 = 23.4 (가정, [5]·[7] 따로 안 잼)
  #   확인: OMX1 왼쪽 173.4 - [4] 35.5 = 칸막이-좌 면 137.9(지도 138.25), OMX2 오른쪽 246 + D1 34 = 280(칸막이-우 280.25)
  #   벽-왼쪽 → 칸막이-좌 면 a 139.8 은 위 값과 1.9 cm 어긋나 쓰지 않음(기록지 검토 항목)
  # 02 선반: [2] - [4] = 10.4 (OMX1 왼쪽 → 선반 왼쪽), 가로 [3] 50, 깊이 a 21(11-02 메모)
  - {name: shelf_02, min: [183.8, 0], max: [233.8, 21]}
  # y: 벽-선반 → 앞면 [8] 50.5 → 50.75 (벽-03 → 앞면 [11] 42.5 → 51.25와 0.5 차이)
  - {name: omx12_left, min: [173.4, 21], max: [196.8, 50.75], provisional: true}
  - {name: omx12_right, min: [222.6, 21], max: [246.0, 50.75], provisional: true}
  # 오목 바닥(가운데 받침 앞면): 벽-선반 → [10] 31.5 → 31.75 (벽-03 → [12] 61.5 → 32.25와 0.5 차이)
  - {name: omx12_back, min: [196.8, 21], max: [222.6, 31.75], provisional: true}

# 라인 노드 그래프. 테이프 = 연결(links) 구간 + 정차 노드의 가로선(bar)
# id 는 Map 페이지 노드 제안 v0.1 번호를 유지한다(N13·N20·H3 삭제, N12 = Nav2 전환).
nodes:
  graph_version: line-v15-20261116
  bar_length: 12             # 정차 노드 가로선 길이(고정, 노드 판정 규칙에 사용)
  items:
    # 물류창고 루프 D 93.2 x c 91.3(바깥 기준): 왼쪽 벽에서 a 20.5, 통로 벽에서 b 72
    - {id: N10, at: [21.7, 73.2], role: 루프 좌하단, links: [N02, N18]}
    - {id: N02, at: [21.7, 162.1], role: 루프 좌상단, links: [N10, N14]}
    - {id: N05, at: [112.5, 162.1], role: 루프 우상단, links: [N15, N07]}
    - {id: N07, at: [112.5, 73.2], role: 루프 우하단·간선, links: [N05, N18, N23]}
    # P5·P6 분기 R 25(루프 바깥선 → 가로선 바깥선). x: 벽-왼쪽 면(0) → 세로선 왼쪽 가장자리
    # [24] 44.5 · [25] 91.5 (+1.2 = 중심). 간격 47로 메모 S 44.5와 2.5 다름
    - {id: N14, at: [45.7, 162.1], role: P5 분기, links: [N02, N15, N16]}
    - {id: N16, at: [45.7, 187.1], role: P5 물류 대기·충전, place: P5, bar: x, links: [N14]}
    - {id: N15, at: [92.7, 162.1], role: P6 분기, links: [N14, N05, N17]}
    - {id: N17, at: [92.7, 187.1], role: P6 물류 대기·충전, place: P6, bar: x, links: [N15]}
    # P4 분기 Q 29.9(간선 바깥선 → 가로선 바깥선). OMX3 앞에서 e 9.6
    # x: N10 바깥선 → N18 바깥선 43.6 (20.5 + 43.6 - 1.2)
    - {id: N18, at: [62.9, 73.2], role: P4 분기, links: [N10, N07, N01]}
    - {id: N01, at: [62.9, 43.3], role: P4 창고 상차, place: P4, bar: x, links: [N18]}
    # P7 = OMX1·2 진입선(세로선). 가로선 y: 벽-선반 → 가로선 선반 쪽 가장자리 [15] 35.7 → 35.95,
    # 중심 37.15. 가로선 ↔ 오목 바닥 [13] V 4(계산 4.2). 실제 가로선 길이 [14] 13(지도는 12 고정).
    # 2026-11-16 사용자 확인: 본선 N07~N09 직선, 선반 벽 휨. 가로선 y는 벽이 아니라 본선 가운데에서 잰
    # 거리로 정함(본선 y 73.2 − 분기 가운데 → 가로선 가운데). [16] W 41이 벽 기준 36.05와 5 cm 달랐던 원인.
    #   N23→N21 41.2 → N21 32.0 · N24→N22 41.5 → N22 31.7
    #   벽이 휘어 기준으로 쓰지 않음: 11-16 벽-선반 면 → N21 가로선 가운데 37, → N22 가로선 가운데 36.
    # N11: 2026-11-16 실측 N19→N11 38.75 cm(지도 36.05와 2.7 cm 차이). 사용자 결정으로 N11·P7은 v14 위치 유지
    #   (OMX1·2 받침·[13] 3.8·P7 마커와 맞춤)
    # x: 벽-왼쪽 면(0) → N11 세로선 왼쪽 가장자리 c 208.2 (+1.2 = 중심). 예전 N07 → N19 94 해석(204.1)은 틀림
    - {id: N19, at: [209.4, 73.2], role: P7 분기, links: [N23, N24, N11]}
    - {id: N11, at: [209.4, 37.15], role: P7 인도장(물류·스마트카트 공용), place: P7, bar: x,
       links: [N19]}
