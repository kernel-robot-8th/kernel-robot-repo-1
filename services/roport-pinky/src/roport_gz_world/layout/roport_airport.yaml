# RO:PORT 시연 공간 배치 데이터 v13 (도면·지도·Gazebo world 생성 원본)
#
# 출처: 강의실 실측 2026-11-02 (Jira FFT1-96), 02 인도장·03 아래 벽 재측정 2026-11-03.
# 실측 메모 사진은 사람이 찍혀 저장소에 넣지 않음.
# 좌표계(실측): 단위 cm, 원점 = 콘센트 벽·통로 쪽 모서리, x = 길이 방향, y = 창가 방향
# 이 파일을 고친 뒤 패키지 폴더에서 다시 생성한다:
#   python3 -m roport_gz_world.generate_world     # worlds/roport_airport.sdf
#   python3 -m roport_gz_world.generate_map       # ../../maps/airport_map.{pgm,yaml,png}
#   python3 -m roport_gz_world.draw_layout        # ../../maps/map_measured_v13.png (matplotlib)
#
# 테이프 치수는 "선 바깥 기준"으로 잰 값이다(메모: D·c, R·Q·N11 세로선은 바깥선부터).
# 아래 좌표는 테이프 중심선이므로 테이프 폭의 절반(1.2 cm)을 더하거나 뺐다.
# provisional: true 는 이번 실측에 없는 값이다(위치 추정·가정).

version: v13
units: cm

# 실측 좌표 → SLAM 지도(map) 좌표: map = R(yaw) * (실측 / 100) + (x_m, y_m)
# 2026-10-27 SLAM 지도(maps/airport_map_slam_20261027.pgm) 벽 점유 칸에 실측 벽을 맞춘 값.
# world 좌표 = map 좌표이므로 로봇은 world (0, 0)에서 SLAM 시작 위치(실측 약 152, 202)에 나타난다.
frame:
  x_m: -1.520
  y_m: -2.0225
  yaw_deg: 0.10

defaults:
  wall_thickness: 0.5        # 가벽 두께
  wall_height: 24            # 실측 (맵 벽 높이 24)
  object_height: 24          # 물체는 벽 높이와 같게 둔다(사용자 결정 2026-11-02)
  line_width: 2.4            # 흰 마스킹 테이프 24 mm

# 실측 기반 지도(pgm) 설정. 해상도·원점·크기는 SLAM 지도와 같게 둬서 기존 좌표를 바꾸지 않는다.
map:
  resolution: 0.05
  origin: [-1.654, -2.094]
  width: 92
  height: 53
  lidar_height: 12.5         # Pinky 라이다 높이. 이보다 낮은 물체는 지도에 그리지 않음

# 벽: 선분(from → to) 중심선, 충돌 있음
walls:
  # 외곽 444.5 x 221: 가로 G 138 + H 306.5, 세로 e 221
  - {name: outer_aisle, from: [0, 0], to: [444.5, 0]}          # 아래 = 통로(콘센트 벽)
  - {name: outer_right, from: [444.5, 0], to: [444.5, 221]}
  - {name: outer_window, from: [444.5, 221], to: [0, 221]}     # 위 = 창가
  - {name: outer_left, from: [0, 221], to: [0, 0]}
  # 03 공용 내부공간: 왼쪽 벽 x = G 138. 아래 벽 y = 통로 벽 → 03 아래 벽 ㅂ 94.5(두 벽 두께 0.5씩 포함)
  # → 벽 중심 94, 통로 쪽 면 93.75. 11-03 메모 Ⓓ 93.5(두 벽 안쪽 면 사이)와 같음.
  # f 129(→ 92)보다 ㅂ·Ⓓ를 쓴다(SLAM 벽 평균 거리 2.8 → 1.6 cm)
  - {name: zone03_left, from: [138, 94], to: [138, 221]}
  # 아래 벽 길이 I = H 306.5 - 입구 65 = 241.5
  - {name: zone03_bottom, from: [138, 94], to: [379.5, 94]}
  # 02 인도장 양옆 칸막이: 인도장 가로 142, 길이 P 54 · T 49 (왼쪽 x는 03 왼쪽 벽과 같은 선으로 가정)
  - {name: partition_warehouse, from: [138, 0], to: [138, 54]}
  - {name: partition_delivery, from: [280, 0], to: [280, 49]}

# 물체: 축 정렬 상자 (min/max 모서리), 충돌 있음
objects:
  # 03 상자 K 67.4 x J 21: 창가 벽에서 N 60.5, 오른쪽 벽에서 L 51.5(ㄴ 51)
  # (03 아래 벽까지 M 46.9 → 45.5로 1.4 차이. 창가 벽 기준 N을 따름)
  - {name: box_03, min: [325.6, 139.5], max: [393.0, 160.5]}
  # 03 카메라 삼각대: 받침대 ㄷ 25.8 x ㄹ 25.5, 03 아래 벽에 붙음. G1 게이트 벽(03 왼쪽 벽)에서 58
  - {name: camera_tripod, min: [196.0, 94.0], max: [221.8, 119.5]}
  # 01 창고박스 b 50.8 x a 39, 높이 11 (라이다보다 낮아 지도에 안 그림). 왼쪽 벽·통로 벽 모서리
  - {name: warehouse_box, min: [0, 0], max: [50.8, 39], height: 11}
  # 01 OMX3 받침: 가로 d 27 x 깊이 c 33, 창고박스 오른쪽에 붙음
  - {name: omx3_base, min: [50.8, 0], max: [77.8, 33]}
  # 02 선반 b 50.5 x a 21, 통로 벽에 붙음. x는 N11 기준 가운데 정렬 가정
  - {name: shelf_02, min: [178.85, 0], max: [229.35, 21], provisional: true}
  # 02 OMX1·2 받침: 가로 c 73, 가운데 오목(폭 f 25.6)에 N11 진입선이 들어감. 선반 앞(y 21)부터.
  # 돌출 앞면 y = 03 아래 벽 면(93.75)에서 Ⓐ 44 → 49.75 (OMX2 앞면 → 간선 Ⓒ 24 → 간선 73.75,
  # 중심선 73.2와 0.55 차이. 이전 D 30.4·G 50.9 기준 51.4·50.9와 1.2~1.7 cm 차이).
  # 오목 바닥 y = N11 가로선 바깥선(31.0) - V 4 = 27.0. 선반·받침 크기 실측이 불확실해(사용자 확인
  # 2026-11-03) Ⓑ 62(→ 31.75)보다 W·V를 쓴다. x는 N11 기준 좌우 대칭 가정
  - {name: omx12_left, min: [167.6, 21], max: [191.3, 49.75], provisional: true}
  - {name: omx12_right, min: [216.9, 21], max: [240.6, 49.75], provisional: true}
  # 오목 바닥(선반 앞 → 오목 바닥)
  - {name: omx12_back, min: [191.3, 21], max: [216.9, 27.0], provisional: true}

# 라인 노드 그래프. 테이프 = 연결(links) 구간 + 정차 노드의 가로선(bar)
# id 는 Map 페이지 노드 제안 v0.1 번호를 유지한다(N13·N20·H3 삭제, N12 = Nav2 전환).
nodes:
  graph_version: line-v13-20261103
  bar_length: 12             # 정차 노드 가로선 길이(고정, 노드 판정 규칙에 사용)
  items:
    # 물류창고 루프 D 93.2 x c 91.3(바깥 기준): 왼쪽 벽에서 a 20.5, 통로 벽에서 b 72
    - {id: N10, at: [21.7, 73.2], role: 루프 좌하단, links: [N02, N18]}
    - {id: N02, at: [21.7, 162.1], role: 루프 좌상단, links: [N10, N14]}
    - {id: N05, at: [112.5, 162.1], role: 루프 우상단, links: [N15, N07]}
    - {id: N07, at: [112.5, 73.2], role: 루프 우하단·간선, links: [N05, N18, N19]}
    # P5·P6 분기 R 25(루프 바깥선 → 가로선 바깥선), 간격 S 44.5. 루프 가운데 대칭 가정
    - {id: N14, at: [44.85, 162.1], role: P5 분기, links: [N02, N15, N16]}
    - {id: N16, at: [44.85, 187.1], role: P5 물류 대기·충전, place: P5, bar: x, links: [N14]}
    - {id: N15, at: [89.35, 162.1], role: P6 분기, links: [N14, N05, N17]}
    - {id: N17, at: [89.35, 187.1], role: P6 물류 대기·충전, place: P6, bar: x, links: [N15]}
    # P4 분기 Q 29.9(간선 바깥선 → 가로선 바깥선). OMX3 앞에서 e 9.6
    # x: N10 바깥선 → N18 바깥선 43.6 (20.5 + 43.6 - 1.2)
    - {id: N18, at: [62.9, 73.2], role: P4 분기, links: [N10, N07, N01]}
    - {id: N01, at: [62.9, 43.3], role: P4 창고 상차, place: P4, bar: x, links: [N18]}
    # P7 = OMX1·2 진입선(세로선) W 41 = N19 → N11(간선 바깥선 → 가로선 바깥선).
    # 가로선과 OMX1·2 받침 오목 바닥 사이 V 4
    # x: N07 → N19 94 (N18과 같이 바깥선 → 바깥선으로 해석: 111.3 + 94 - 1.2)
    - {id: N19, at: [204.1, 73.2], role: P7 분기, links: [N07, N09, N11]}
    - {id: N11, at: [204.1, 32.2], role: P7 인도장(물류·스마트카트 공용), place: P7, bar: x,
       links: [N19]}
    # P1·P2 분기 U 40, P1–P2 간격 ㅈ 31.5, P2 → 간선 끝 ㄱ 38.8 (간격은 선 중심 기준 가정)
    - {id: N09, at: [308.0, 73.2], role: P1 분기, links: [N19, N08, H1]}
    - {id: H1, at: [308.0, 33.2], role: P1 스마트카트 대기·충전, place: P1, bar: x, links: [N09]}
    - {id: N08, at: [339.5, 73.2], role: P2 분기, links: [N09, N12, H2]}
    - {id: H2, at: [339.5, 33.2], role: P2 스마트카트 대기·충전, place: P2, bar: x, links: [N08]}
    # 간선 끝: 루프 왼쪽 바깥선에서 O 359 = 03 아래 벽 끝(입구 시작)과 같은 x
    - {id: N12, at: [378.3, 73.2], role: 간선 끝·Nav2 전환, bar: y, nav2_switch: true,
       links: [N08]}

# ArUco 마커 부착 제안 위치(ArUco v1.3: 벽 100 mm, P4·P7 바닥 20 mm). 충돌 없음.
# 벽 마커는 정차 노드 정면 벽, 바닥 마커는 가로선 앞(진행 방향) 빈 바닥 가운데.
# 실제 부착 제안: 벽 마커는 종이(116 mm) 아래 끝을 바닥에 맞춤 → 중심 약 6 cm(카메라 렌즈 6.3 cm와
# 같은 높이, ArUco v1.3 "바닥에 최대한 가깝게"). 부착 후 위치를 재서 이 값을 고친다.
# Gazebo GPU 라이다는 visual 을 보고 거리를 재므로, 실제 SLAM 지도에 마커가 보이지 않은 것과
# 맞추려고 world 의 벽 표시판 윗면은 라이다 높이(12.5 cm)보다 낮게(10 cm) 둔다.
# facing_deg: 마커 앞면이 향하는 방향(실측 좌표, 0 = +x). floor: true = 바닥에 눕혀 붙임
markers:
  defaults: {size: 10, center_height: 5, provisional: true}
  items:
    - {name: G1, center: [138.5, 120.9], facing_deg: 0}
    - {name: G2, center: [138.5, 158.8], facing_deg: 0}
    - {name: G3, center: [138.5, 204.8], facing_deg: 0}
    - {name: ARR, center: [444.0, 200.0], facing_deg: 180}
    - {name: P1, center: [308.0, 0.5], facing_deg: 90}
    - {name: P2, center: [339.5, 0.5], facing_deg: 90}
    - {name: P5, center: [44.85, 220.5], facing_deg: -90}
    - {name: P6, center: [89.35, 220.5], facing_deg: -90}
    # 바닥: P4 = N01 가로선과 OMX3 받침 사이(9.1 cm), P7 = N11 가로선과 오목 바닥 사이(4 cm)
    - {name: P4, center: [62.9, 37.6], facing_deg: -90, size: 2, floor: true}
    - {name: P7, center: [204.1, 29.0], facing_deg: -90, size: 2, floor: true}
