# 기체별 IR 기준값. 순서 [왼쪽 ir0, 가운데 ir1, 오른쪽 ir2] = ir_sensor/range data[0..2]
# 조건: 회색 카펫 + 흰 마스킹 테이프 24 mm 2겹, 로봇 정지 상태 (2026-10-31 3대 실측)
# 출처: Confluence「Pinky IR 센서·라인 주행 시험 노트」(MFS 14745871) 9절
#   carpet    = 카펫 위 중앙값(기본 조명)
#   tape      = 2겹 테이프 위 중앙값
#   threshold = (모든 조명의 카펫 최저 0.5%) + (2겹 위 최고 0.5%) ÷ 2. 값 < threshold 이면 라인
# 임계값은 제안값이다. 주행 시험(FFT1-116)에서 확정한다.
hysteresis: 100

robots:
  pinky_764e:   # PP_26091
    carpet: [2952, 2506, 2142]
    tape: [1313, 269, 258]
    threshold: [2130, 1240, 1010]
  pinky_6422:   # PP_26072
    carpet: [2077, 2321, 2678]
    tape: [259, 377, 922]
    threshold: [1170, 1350, 1760]
  pinky_d660:   # PP_26108
    carpet: [2308, 2376, 2233]
    tape: [299, 388, 281]
    threshold: [1300, 1380, 1260]
