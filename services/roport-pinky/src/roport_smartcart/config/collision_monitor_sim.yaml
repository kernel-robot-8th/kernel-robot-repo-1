# Simulation candidates only; not measured stopping distances for hardware.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel
    cmd_vel_out_topic: cmd_vel_safe
    state_topic: collision_monitor_state
    enable_stamped_cmd_vel: false
    transform_tolerance: 0.2
    source_timeout: 0.5
    stop_pub_timeout: 2.0
    polygons: [Stop, Approach, Slow]
    Stop:
      type: polygon
      # 16 cm simulated footprint plus 4 cm on every side. The approach
      # zone below projects this envelope along translation AND rotation.
      points: '[[0.12, 0.12], [0.12, -0.12], [-0.12, -0.12], [-0.12, 0.12]]'
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: stop_zone
    Approach:
      type: polygon
      points: '[[0.12, 0.12], [0.12, -0.12], [-0.12, -0.12], [-0.12, 0.12]]'
      action_type: approach
      time_before_collision: 2.0
      simulation_time_step: 0.05
      min_points: 1
      visualize: true
      polygon_pub_topic: approach_zone
    Slow:
      type: polygon
      points: '[[0.45, 0.16], [0.45, -0.16], [-0.10, -0.16], [-0.10, 0.16]]'
      action_type: slowdown
      slowdown_ratio: 0.3
      min_points: 1
      visualize: true
      polygon_pub_topic: slow_zone
    observation_sources: [scan, sonar]
    scan:
      type: scan
      topic: scan
    sonar:
      type: range
      topic: us_sensor/range
      obstacles_angle: 0.03
