# Overlay for the field Nav2 stack while shopping. Preserve the site map and footprint.
local_costmap:
  local_costmap:
    ros__parameters:
      plugins:
      - voxel_layer
      - sonar_layer
      - inflation_layer
      sonar_layer:
        plugin: roport_range_layer::FreshRangeLayer
        topics:
        - /us_sensor/range
        input_sensor_type: VARIABLE
        clear_on_max_reading: false
        no_readings_timeout: 0.5
        clear_threshold: 0.2
        mark_threshold: 0.8
        observation_keep_time: 12.0
global_costmap:
  global_costmap:
    ros__parameters:
      # Jazzy publishes only after its period has strictly elapsed, from the
      # update loop. At 2/2 Hz an aligned skip could consume the 1 s grid TTL.
      update_frequency: 3.0
      publish_frequency: 3.0
      always_send_full_costmap: true  # Shopping subscribes to full grids.
      plugins:
      - static_layer
      - obstacle_layer
      - sonar_layer
      - inflation_layer
      sonar_layer:
        plugin: roport_range_layer::FreshRangeLayer
        topics:
        - /us_sensor/range
        input_sensor_type: VARIABLE
        clear_on_max_reading: false
        no_readings_timeout: 0.5
        clear_threshold: 0.2
        mark_threshold: 0.8
        observation_keep_time: 12.0

# Short shopper-relative goals need the cart's path tracker to follow a curved
# bypass all the way through. Keep collision checking and cost-based slowing.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      use_velocity_scaled_lookahead_dist: false
      lookahead_dist: 0.12
      approach_velocity_scaling_dist: 0.14
      min_approach_linear_velocity: 0.02
      regulated_linear_scaling_min_speed: 0.025
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.55
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.15
      inflation_cost_scaling_factor: 3.0
      allow_reversing: false
