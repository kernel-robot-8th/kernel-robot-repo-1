# Shared starting profile, not a validated hardware safety configuration.
# Instructor cost-field approach: reference/2026-09-14; tracking values are
# airport simulation candidates. Global static-map resolution stays map-defined.
amcl:
  ros__parameters:
    update_min_a: 0.01
    update_min_d: 0.05
bt_navigator:
  ros__parameters:
    default_server_timeout: 500  # ms; allow brief goal-acknowledgement scheduling delays
controller_server:
  ros__parameters:
    FollowPath:
      lookahead_dist: 0.30
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.45
      lookahead_time: 1.0
      curvature_lookahead_dist: 0.30
      inflation_cost_scaling_factor: 5.0
      cost_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      allow_reversing: false
    general_goal_checker:
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.15
    progress_checker_plugins: [progress_checker]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.15
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
local_costmap:
  local_costmap:
    ros__parameters:
      resolution: 0.01
      footprint_padding: 0.01
      inflation_layer:
        inflation_radius: 1.0
        cost_scaling_factor: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.01
      inflation_layer:
        inflation_radius: 1.0
        cost_scaling_factor: 10.0
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      tolerance: 0.1  # m; keep the alternative-goal search inside the small airport map
