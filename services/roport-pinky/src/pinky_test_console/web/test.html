<!DOCTYPE html>
<!-- pinky_test_console 통합 테스트 화면 (mode:=fleet, 노트북). 테스트 관제·Pinky 설정과 로봇별 시험 화면
     (경로 주행·IR 측정·조종/지도·AMCL)과 노트북의 정밀 도킹 화면(dock.html)을 탭으로 연다. 로봇 화면은 노트북이 /robot/<이름>/ 으로 중계.
     마커 테스트 탭은 마커 부착·시험 뒤에 추가. 인라인 코드·CDN 없음. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinky 통합 테스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="tt-page">

<header id="topbar">
  <div class="brand">RO:PORT <span>Pinky 통합 테스트</span></div>
  <nav class="tt-tabs" aria-label="화면">
    <button class="btn btn-outline btn-small tt-tab" type="button" data-tab="fleet">테스트 관제</button>
    <button class="btn btn-outline btn-small tt-tab" type="button" data-tab="settings">Pinky 설정</button>
    <span class="tt-sep">|</span>
    <select id="robotSel" class="text-input ir-select" title="로봇 화면을 볼 로봇"></select>
    <button class="btn btn-outline btn-small tt-tab" type="button" data-tab="route" data-robot="route.html">경로 주행</button>
    <button class="btn btn-outline btn-small tt-tab" type="button" data-tab="ir" data-robot="ir.html">IR 측정</button>
    <button class="btn btn-outline btn-small tt-tab" type="button" data-tab="dock" title="노트북 화면: 탑뷰 카메라로 도킹 값 계산·적용·시험(고른 로봇에 명령)">정밀 도킹</button>
    <button class="btn btn-outline btn-small tt-tab" type="button" data-tab="console" data-robot="index.html">조종·지도</button>
    <button class="btn btn-outline btn-small tt-tab" type="button" data-tab="amcl" data-robot="amcl.html">AMCL</button>
  </nav>
  <span id="modeHint" class="status-msg" role="status"></span>
  <button id="btnHomeAll" class="btn btn-outline btn-small" type="button" title="노드에서 끝난 모든 로봇을 각자 충전·대기 칸으로">⌂ 전체 복귀</button>
  <button id="btnEstop" type="button" title="등록된 모든 로봇에 경로 정지 + 속도 0 (단축키: Space / Esc)">■ 전체 정지</button>
</header>

<div id="frames" class="tt-frames"></div>
<div class="tiny-note tt-note">로봇 화면은 그 로봇의 테스트 콘솔 모드가 맞아야 동작: 경로 주행·IR 측정 = <code>mode:=test</code> (IR만은 <code>mode:=ir</code>), 조종·지도 = <code>slam</code>·<code>nav</code>, AMCL = <code>amcl</code>. 「테스트 관제」에서 test·ir 모드로 켜고 끌 수 있음.</div>

<script src="test.js"></script>
</body>
</html>
