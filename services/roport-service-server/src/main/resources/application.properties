spring.application.name=roport-service-server
server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# 개발용 DB. 접속 정보는 환경변수로만 주입하고 비밀값을 저장소에 두지 않는다.
spring.datasource.url=${SERVICE_DB_URL:jdbc:postgresql://127.0.0.1:5432/roport_service}
spring.datasource.username=${SERVICE_DB_USER:postgres}
spring.datasource.password=${SERVICE_DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
# 프레임워크 기본 오류(405·415·404 등)도 problem+json으로 응답한다. 500은 Boot 기본 /error JSON이다.
spring.mvc.problemdetails.enabled=true
# ponytail: HTTP 로컬 개발이라 session cookie secure 미설정. HTTPS 배포 시 server.servlet.session.cookie.secure=true.
