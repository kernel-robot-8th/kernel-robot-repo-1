spring.application.name=roport-service-server
server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# 개발용 DB. 접속 정보는 환경변수로만 주입하고 비밀값을 저장소에 두지 않는다.
spring.datasource.url=${SERVICE_DB_URL:jdbc:postgresql://127.0.0.1:5432/roport_service}
spring.datasource.username=${SERVICE_DB_USER:postgres}
spring.datasource.password=${SERVICE_DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
# 개발 전용 로그인(비밀번호 없음). 기본 꺼짐이라 켜기 전에는 모든 /api/** 가 401이다. 로컬에서만 SERVICE_DEV_LOGIN=true.
service.dev-login.enabled=${SERVICE_DEV_LOGIN:false}
# 개발 전용 카트 인증(X-Cart-Id 헤더만 확인, 비밀값 없음). 기본 꺼짐이라 켜기 전에는 모든 /cart-api/** 가 401이다. 로컬에서만 SERVICE_DEV_CART=true.
service.dev-cart.enabled=${SERVICE_DEV_CART:false}
# 프레임워크 기본 오류(405·415·404 등)와 처리되지 않은 500도 problem+json(일반 code 포함)으로 응답한다.
spring.mvc.problemdetails.enabled=true
# ponytail: HTTP 로컬 개발이라 session cookie secure 미설정. HTTPS 배포 시 server.servlet.session.cookie.secure=true.

# Dedicated control credentials; transport is off until explicitly configured.
service.control.enabled=${SERVICE_CONTROL_ENABLED:false}
service.control.site=${SERVICE_CONTROL_SITE:}
service.control.token=${SERVICE_CONTROL_TOKEN:}
